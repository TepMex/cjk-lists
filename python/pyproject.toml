[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cjk-lists"
version = "0.1.0"
description = "Official CJK character and word lists (HSK, SUBTLEX-CH, and more to come)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "cjk-lists contributors" }]
keywords = ["chinese", "hanzi", "hsk", "cjk", "mandarin", "subtlex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
  "Topic :: Text Processing :: Linguistic",
]
urls = { Homepage = "https://github.com/TepMex/cjk-lists" }

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cjk_lists = ["py.typed"]
